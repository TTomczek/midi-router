name: Build and release

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore midi-router.sln

      - name: Build solution
        run: dotnet build midi-router.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test midi-router.sln --configuration Release --no-build --no-restore

  release:
    name: Publish Windows executable
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore midi-router.csproj --runtime win-x64

      - name: Publish single-file executable
        run: >
          dotnet publish midi-router.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MIDI Router v${{ github.run_number }}
          generate_release_notes: true
          files: publish/midi-router.exe
